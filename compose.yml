services:
  wordpress:
    build: .
    container_name: wordpress
    expose:
      - "9000"
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DEBUG: "true"
      WP_ENV: ${WP_ENV} # "development" | "production"
      WP_REPAIR: "false"
      FORCE_SSL_ADMIN: "true"
      WP_HOME: ${WORDPRESS_WP_HOME}
      WORDPRESS_WP_SITEURL: ${WORDPRESS_WP_SITEURL}
      WP_REDIS_PATH: /var/run/redis/redis.sock
      WORDPRESS_CONFIG_EXTRA: |
        if (!defined('WP_CACHE')) define('WP_CACHE', true);
        define('WP_CACHE_KEY_SALT', '${WORDPRESS_WP_SITEURL}');
        define('WP_REDIS_HOST', '${REDIS_HOST}');
        define('WP_REDIS_PASSWORD', '${REDIS_PWD}');
        define('WP_REDIS_DATABASE', ${REDIS_DB});

        if (!defined('WP_ENV')) {
          define('WP_ENV', getenv('WP_ENV') ?: 'production');
        }

        // Set protocol and hostname
        if (isset($$_SERVER['HTTP_HOST'])) {
          $$hostname = $$_SERVER['HTTP_HOST'];
        } else {
          $$hostname = 'localhost';
        }
        $$protocol = (!empty($$_SERVER['HTTPS']) && $$_SERVER['HTTPS'] !== 'off') ? 'https://' : 'http://';

        // Ngrok/Proxy detection
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && strpos($$_SERVER['HTTP_X_FORWARDED_PROTO'], 'https') !== false) {
          $$_SERVER['HTTPS'] = 'on';
          $$protocol = 'https://';
        }
        if (isset($$_SERVER['HTTP_X_FORWARDED_HOST']) && strpos($$_SERVER['HTTP_X_FORWARDED_HOST'], 'ngrok') !== false) {
          $$hostname = $$_SERVER['HTTP_X_FORWARDED_HOST'];
        }

        define('WP_HOME', $$protocol . $$hostname);
        define('WP_SITEURL', $$protocol . $$hostname);

        switch (WP_ENV) {
          case 'development':
            // Debugging
            if (!defined('WP_DEBUG')) define('WP_DEBUG', true);
            if (!defined('WP_DEBUG_LOG')) define('WP_DEBUG_LOG', '/var/www/html/wp-content/debug/debug.log');
            if (!defined('WP_DEBUG_DISPLAY')) define('WP_DEBUG_DISPLAY', false);
            if (!defined('SCRIPT_DEBUG')) define('SCRIPT_DEBUG', true);

            // Performance for dev
            define('WP_POST_REVISIONS', 3);
            define('AUTOSAVE_INTERVAL', 120);
            define('EMPTY_TRASH_DAYS', 7);

            // Cron/Updates
            define('DISABLE_WP_CRON', false);
            define('WP_AUTO_UPDATE_CORE', true);

            // Memory
            define('WP_MEMORY_LIMIT', '1024M');
            define('WP_MAX_MEMORY_LIMIT', '8196M');

            // Dev mode
            define('DISALLOW_FILE_EDIT', false);
            define('DISALLOW_FILE_MODS', false);
            define('WP_ENVIRONMENT_TYPE', 'development');
            define('WP_DEVELOPMENT_MODE', 'all');

            // Asset concatenation/compression
            define('COMPRESS_CSS', false);
            define('COMPRESS_SCRIPTS', false);
            define('CONCATENATE_SCRIPTS', false);
            define('ENFORCE_GZIP', false);
            define('FS_METHOD', 'direct');
            break;

          case 'production':
          default:
            // Production settings
            if (!defined('WP_DEBUG')) define('WP_DEBUG', false);
            if (!defined('WP_DEBUG_DISPLAY')) define('WP_DEBUG_DISPLAY', false);
            if (!defined('SCRIPT_DEBUG')) define('SCRIPT_DEBUG', false);
            define('DISALLOW_FILE_EDIT', false);
            define('DISALLOW_FILE_MODS', false);
            define('WP_ENVIRONMENT_TYPE', 'production');
            define('FORCE_SSL_ADMIN', true); // Force SSL for admin
            define('AUTOSAVE_INTERVAL', 300); // Autosave every 5 minutes
            define('EMPTY_TRASH_DAYS', 7); // Empty trash every week
            define('WP_POST_REVISIONS', 10); // Limit post revisions
            define('WP_MEMORY_LIMIT', '2048M'); // Set memory limit
            define('WP_MAX_MEMORY_LIMIT', '8196M'); // Set max memory limit
            define('WP_CRON_LOCK_TIMEOUT', 60); // Cron lock timeout
            
            define('WP_AUTO_UPDATE_CORE', true);
            define('DISABLE_WP_CRON', false);

            // Asset concatenation/compression
            define('CONCATENATE_SCRIPTS', true); // Combine JS files
            define('COMPRESS_SCRIPTS', true); // Compress JS
            define('COMPRESS_CSS', true); // Compress CSS

            // Security hardening
            define('DISALLOW_UNFILTERED_HTML', true);
            define('WP_HTTP_BLOCK_EXTERNAL', false);
            define('WP_ACCESSIBLE_HOSTS', 'api.wordpress.org'); // Allow updates

            define('FS_METHOD', 'direct');
            break;
        }

        // Allow DB repair if enabled
        define('WP_ALLOW_REPAIR', filter_var(getenv('WP_REPAIR'), FILTER_VALIDATE_BOOLEAN) ? true : false);
    volumes:
      - wordpress:/var/www/html
      - ./wordpress/wp-content:/var/www/html/wp-content
      - redis-socket:/var/run/redis
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "curl", "-f", "https://localhost"]
      interval: 1m
      timeout: 10s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"

  caddy:
    image: caddy:latest
    container_name: caddy
    depends_on:
      - wordpress
    ports:
      - "443:443"
      - "443:443/udp"
      - "80:80"
    volumes:
      - wordpress:/var/www/html:ro
      - ./wordpress/wp-content:/var/www/html/wp-content:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # generate your own SSL via "mkcert"
      - ./localhost.pem:/var/www/certs/localhost.crt:ro
      - ./localhost-key.pem:/var/www/certs/localhost.key:ro
      - type: tmpfs
        target: /data
      - type: tmpfs
        target: /config

  db:
    image: mysql:latest
    container_name: wordpress_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASS: ${MYSQL_PASS}
    volumes:
      - db:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASS || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
  phpmyadmin:
    image: phpmyadmin
    container_name: phpmyadmin
    environment:
      PMA_HOST: ${PMA_HOST}
      PMA_USER: ${PMA_USER}
      PMA_PASSWORD: ${PMA_PASSWORD}
      PMA_ARBITRARY: 1
      APACHE_PORT: 81
    ports:
      - "81:81"
    depends_on:
      - db
  redis:
    image: redis:latest
    container_name: wordpress_redis
    command: sh -c "mkdir -p /var/run/redis && chmod 777 /var/run/redis && redis-server --requirepass ${REDIS_PWD} --maxmemory ${REDIS_MAXMEMORY} --maxmemory-policy ${REDIS_MAXMEMORY_POLICY} --port ${REDIS_PORT} --unixsocket /var/run/redis/redis.sock --unixsocketperm 777"
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    volumes:
      - type: tmpfs
        target: /data
      - redis-socket:/var/run/redis

