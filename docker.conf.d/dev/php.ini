upload_max_filesize = 1024M
post_max_size = 1024M
memory_limit = 8192M
max_execution_time = 3600
display_errors = On
error_reporting = E_ALL
max_input_time=600
file_uploads=On
max_file_uploads=50
realpath_cache_size = 4096M
realpath_cache_ttl = 7200

; APCu settings
apc.enabled=1
apc.shm_size=4196M
apc.ttl=7200
apc.user_ttl=7200
apc.gc_ttl=3600

; Brotli extension settings
brotli.enable=1
brotli.compression_level=11

; ZSTD extension settings
zstd.enable=1
zstd.compression_level=22