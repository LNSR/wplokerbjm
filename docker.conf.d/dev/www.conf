[www]

user = wordpress
group = wordpress

listen = /var/run/sock/php-fpm.sock
listen.owner = wordpress
listen.group = wordpress
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 5
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.process_idle_timeout = 0
pm.max_requests = 100000

pm.status_path = /status

rlimit_files = 0
rlimit_core = 0

; Security
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,parse_ini_file,show_source
php_admin_value[open_basedir] = /var/www/html:/tmp:/var/run/sock