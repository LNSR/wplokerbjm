name: SSG Build & Deploy (Sitemap)

on:
  schedule:
    # Run every hour
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Perform a dry-run instead of a real deploy"
        required: false
        default: "false"

env:
  THEME_DIR: wordpress/wp-content/themes/wplokerbjm
  SITE_URL: ${{ secrets.SITE_URL }}

jobs:
  build-and-deploy:
    name: Build and deploy SSG (Sitemap)
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          theme-dir: ${{ env.THEME_DIR }}
          install-jq: true
          install-playwright: true
      - name: Setup GitHub CLI
        uses: sersoft-gmbh/setup-gh-cli-action@v2
        with:
          version: stable
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Disable selective url SSG workflow to prevent duplicate runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATE=$(gh workflow list --json id,name,state | jq -r '.[] | select(.id == 185023324) | .state')
          echo "Workflow state: $STATE"
          if [ "$STATE" = "active" ]; then
            gh workflow disable 185023324
            echo "Workflow disabled"
          else
            echo "Workflow already disabled or inactive"
          fi

      - name: Generate SSG Content (Sitemap)
        working-directory: ${{ env.THEME_DIR }}
        env:
          SSG_MINIFY_HTML: "true"
          # Reduce concurrency to avoid exhausting runner resources and crashing Chromium
          SSG_CONCURRENCY: "20"
          # Increase per-page timeout to tolerate slow pages (ms)
          SSG_PAGE_TIMEOUT: "60000"
          # Allow continuing when some pages fail; useful for sitemap runs
          SSG_CONTINUE_ON_ERROR: "false"
          # Number of retries for failed pages
          SSG_MAX_RETRIES: "100"
          # AdBlock settings for policy compliance
          SSG_BLOCK_ADS: "true"
          SSG_BLOCK_TRACKING: "true"
          SSG_BLOCK_ANALYTICS: "true"
          SSG_LOG_BLOCKED: "false"
          # DNS over HTTPS for enhanced ad blocking
          SSG_DOH_SERVER: "https://dns.adguard.com/dns-query"
        run: |
          echo "Using sitemap: ${{ env.SITE_URL }}/sitemap_index.xml"
          bun run ssg:sitemap "${{ env.SITE_URL }}/sitemap_index.xml"
      - name: Setup deployment
        uses: ./.github/actions/setup-deployment
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-key-passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          host: ${{ secrets.HOST }}
          ssh-port: ${{ secrets.SSH_PORT }}
          ssh-user: ${{ secrets.SSH_USER }}

      - name: Compress and deploy SSG via SCP (sitemap mode)
        working-directory: ${{ env.THEME_DIR }}
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
          SSH_USER: ${{ secrets.SSH_USER }}
          HOST: ${{ secrets.HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: bash ../../../../.github/scripts/ssg/generate-ssg-sitemap.sh

      - name: Enable selective url SSG workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow enable 185023324
