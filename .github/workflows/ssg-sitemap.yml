name: SSG Build & Deploy (Sitemap)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Perform a dry-run instead of a real deploy"
        required: false
        default: "false"

env:
  THEME_DIR: wordpress/wp-content/themes/astra-child
  SITE_URL: ${{ secrets.SITE_URL }}

jobs:
  build-and-deploy:
    name: Build and deploy SSG (Sitemap)
    runs-on: ubuntu-latest
    env:
      RCLONE_TRANSFERS: "4"
      RCLONE_CHECKERS: "8"
      RCLONE_RETRIES: "3"
      RCLONE_LOW_RETRIES: "10"
      RCLONE_LOG_LEVEL: "INFO"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          theme-dir: ${{ env.THEME_DIR }}
          install-jq: true
          install-playwright: true

      - name: Generate SSG Content (Sitemap)
        working-directory: ${{ env.THEME_DIR }}
        env:
          SSG_MINIFY_HTML: "true"
          # Reduce concurrency to avoid exhausting runner resources and crashing Chromium
          SSG_CONCURRENCY: "2"
          # Increase per-page timeout to tolerate slow pages (ms)
          SSG_PAGE_TIMEOUT: "60000"
          # Allow continuing when some pages fail; useful for sitemap runs
          SSG_CONTINUE_ON_ERROR: "false"
          # Number of retries for failed pages
          SSG_MAX_RETRIES: "4"
        run: |
          echo "Using sitemap: ${{ env.SITE_URL }}/sitemap_index.xml"
          bun run ssg:sitemap "${{ env.SITE_URL }}/sitemap_index.xml"

      - name: Setup deployment
        uses: ./.github/actions/setup-deployment
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-key-passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          host: ${{ secrets.HOST }}
          ssh-port: ${{ secrets.SSH_PORT }}
          ssh-user: ${{ secrets.SSH_USER }}

      - name: Install rclone and sync via SFTP (sitemap mode)
        working-directory: ${{ env.THEME_DIR }}
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
          SSH_USER: ${{ secrets.SSH_USER }}
          HOST: ${{ secrets.HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
          SRC_DIR: ${{ env.THEME_DIR }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          RCLONE_TRANSFERS: ${{ env.RCLONE_TRANSFERS }}
          RCLONE_CHECKERS: ${{ env.RCLONE_CHECKERS }}
          RCLONE_RETRIES: ${{ env.RCLONE_RETRIES }}
          RCLONE_LOW_RETRIES: ${{ env.RCLONE_LOW_RETRIES }}
          RCLONE_LOG_LEVEL: ${{ env.RCLONE_LOG_LEVEL }}
        run: bash ../../../../.github/scripts/ssg/generate-ssg-sitemap.sh
