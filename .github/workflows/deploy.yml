name: Build & Deploy Theme via Rclone

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Perform a dry-run instead of a real deploy"
        required: false
        default: "false" # 'off', change to 'true' for dry runs

env:
  THEME_DIR: wordpress/wp-content/themes/astra-child

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    env:
      RCLONE_TRANSFERS: "4"
      RCLONE_CHECKERS: "8"
      RCLONE_RETRIES: "3"
      RCLONE_LOW_RETRIES: "10"
      RCLONE_LOG_LEVEL: "INFO"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Verify Bun
        run: |
          echo "Bun: $(bun --version || echo 'bun not found')"

      - name: Install dependencies (theme)
        working-directory: ${{ env.THEME_DIR }}
        run: |
          # ensure bun is available
          echo "Bun: $(bun --version || echo 'bun not found')"
          bun install

      - name: Build (theme)
        working-directory: ${{ env.THEME_DIR }}
        run: bun run build

      - name: Setup PHP & Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2

      - name: Composer install (no-dev)
        working-directory: ${{ env.THEME_DIR }}
        run: |
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
          HOST: ${{ secrets.HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: bash .github/scripts/prepare-ssh-key.sh

      - name: Verify deploy key is usable (non-interactive)
        env:
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
        run: bash .github/scripts/verify-deploy-key.sh

      - name: SSH auth check (using deploy key)
        # Diagnostic: try authenticating with the exact deploy key that will be used by Rclone.
        continue-on-error: true
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          HOST: ${{ secrets.HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: bash .github/scripts/ssh-auth-check.sh
      - name: Setup rclone
        uses: AnimMouse/setup-rclone@v1

      - name: Install rclone and sync via SFTP
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.SSH_USER }}
          HOST: ${{ secrets.HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
          SRC_DIR: ${{ env.THEME_DIR }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          RCLONE_TRANSFERS: ${{ env.RCLONE_TRANSFERS }}
          RCLONE_CHECKERS: ${{ env.RCLONE_CHECKERS }}
          RCLONE_RETRIES: ${{ env.RCLONE_RETRIES }}
          RCLONE_LOW_RETRIES: ${{ env.RCLONE_LOW_RETRIES }}
          RCLONE_LOG_LEVEL: ${{ env.RCLONE_LOG_LEVEL }}
        run: bash .github/scripts/rclone-sync.sh
