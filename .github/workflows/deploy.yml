name: Build & Deploy Theme via Rclone

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Perform a dry-run instead of a real deploy'
        required: false
        default: 'false' # 'off', change to 'true' for dry runs

env:
  THEME_DIR: wordpress/wp-content/themes/astra-child

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    env:
      RCLONE_TRANSFERS: '4'
      RCLONE_CHECKERS: '8'
      RCLONE_RETRIES: '3'
      RCLONE_LOW_RETRIES: '10'
      RCLONE_LOG_LEVEL: 'INFO'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Verify Bun
        run: |
          echo "Bun: $(bun --version || echo 'bun not found')"

      - name: Install dependencies (theme)
        working-directory: ${{ env.THEME_DIR }}
        run: |
          # ensure bun is available
          echo "Bun: $(bun --version || echo 'bun not found')"
          bun install

      - name: Build (theme)
        working-directory: ${{ env.THEME_DIR }}
        run: bun run build

      - name: Setup PHP & Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Composer install (no-dev)
        working-directory: ${{ env.THEME_DIR }}
        run: |
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Prepare SSH key
        # Writes SSH key to a temporary file (safe), optionally strips passphrase, adds to agent,
        # and stores the path in GITHUB_ENV for use by later steps. Avoid echoing the raw secret.
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
          HOST: ${{ secrets.HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "Writing deploy key to a secure temporary file"
          TMP_KEY=$(mktemp)
          # Write the private key safely; expand any literal "\n" sequences into real newlines
          # and ensure a trailing newline (helps when secrets were stored with literal \n).
          printf '%b\n' "$SSH_PRIVATE_KEY" > "$TMP_KEY"
          chmod 600 "$TMP_KEY"
          # If a passphrase is provided, remove it so ssh-add can use the key non-interactively
          if [ -n "${SSH_KEY_PASSPHRASE:-}" ]; then
            echo "Removing passphrase from key"
            # Attempt to remove passphrase; if ssh-keygen fails the key file may be malformed.
            ssh-keygen -p -P "$SSH_KEY_PASSPHRASE" -N "" -f "$TMP_KEY" || true
          fi
          # Minimal debug helpers (do not print the private key): show file mode and the first/last lines count
          echo "DEBUG: key file mode: $(stat -c %a "$TMP_KEY" 2>/dev/null || true)" >&2
          echo "DEBUG: key file size: $(stat -c %s "$TMP_KEY" 2>/dev/null || true) bytes" >&2
          eval "$(ssh-agent -s)"
          ssh-add "$TMP_KEY"
          # Ensure known_hosts contains the host fingerprint (use provided port or default 22)
          PORT=${SSH_PORT:-22}
          ssh-keyscan -p $PORT $HOST >> ~/.ssh/known_hosts || true
          # Persist the chosen key path for use in subsequent steps (safer than hardcoding /tmp)
          echo "DEPLOY_KEY_PATH=$TMP_KEY" >> "$GITHUB_ENV"

      - name: Verify deploy key is usable (non-interactive)
        env:
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          KEY_PATH=${DEPLOY_KEY_PATH:-}
          if [ -z "$KEY_PATH" ]; then
            echo "ERROR: DEPLOY_KEY_PATH is not set; prepare step may have failed"
            exit 1
          fi
          # Quick check: ssh-keygen -y fails if the key is passphrase-protected or invalid
          if ssh-keygen -y -f "$KEY_PATH" >/dev/null 2>&1; then
            echo "Deploy key is not passphrase-protected or is already unlocked"
            exit 0
          fi

          if [ -n "${SSH_KEY_PASSPHRASE:-}" ]; then
            echo "Deploy key appears encrypted; attempting to strip passphrase using SSH_KEY_PASSPHRASE"
            ssh-keygen -p -P "$SSH_KEY_PASSPHRASE" -N "" -f "$KEY_PATH" || true
            if ssh-keygen -y -f "$KEY_PATH" >/dev/null 2>&1; then
              echo "Passphrase removed from deploy key"
              exit 0
            fi
          fi

          echo "ERROR: $KEY_PATH is passphrase-protected or invalid and could not be unlocked non-interactively."
          echo "Options: (1) set the SSH_KEY_PASSPHRASE secret to the key's passphrase so the workflow can strip it;"
          echo "         (2) use an unencrypted private key in SSH_PRIVATE_KEY;"
          exit 1

      - name: SSH auth check (using deploy key)
        # Diagnostic: try authenticating with the exact deploy key that will be used by Rclone.
        continue-on-error: true
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          HOST: ${{ secrets.HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set +e
          PORT=${SSH_PORT:-22}
          KEY_PATH=${DEPLOY_KEY_PATH:-/tmp/deploy_key}
          echo "Testing SSH auth to ${SSH_USER}@${HOST} port $PORT"
          # Use IdentitiesOnly to ensure ssh uses only the provided key; avoid verbose debug output
          ssh -i "$KEY_PATH" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=10 -p $PORT ${SSH_USER}@${HOST} 'echo SSH_AUTH_OK' >/dev/null 2>&1 || true
      - name: Setup rclone
        uses: AnimMouse/setup-rclone@v1

      - name: Install rclone and sync via SFTP
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.SSH_USER }}
          HOST: ${{ secrets.HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
          SRC_DIR: ${{ env.THEME_DIR }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail

          echo "Starting deploy (no persistent logs will be written)"

          eval "$(ssh-agent -s)"
          KEY_PATH=${DEPLOY_KEY_PATH:-/tmp/deploy_key}
          chmod 600 "$KEY_PATH" || true
          if [ -n "${SSH_KEY_PASSPHRASE:-}" ]; then
            ssh-keygen -p -P "$SSH_KEY_PASSPHRASE" -N "" -f "$KEY_PATH" || true
          fi
          ssh-add "$KEY_PATH"
          # Suppress direct fingerprint output; just ensure an identity exists
          if ! ssh-add -l >/dev/null 2>&1; then
            echo 'ssh-agent has no keys; failing' && exit 1
          fi
          PORT=${SSH_PORT:-22}
          mkdir -p ~/.ssh
          ssh-keyscan -p $PORT $HOST >> ~/.ssh/known_hosts || true

          rclone config create sftpdeploy sftp host ${HOST} user ${SSH_USER} port ${SSH_PORT:-22} use-agent true

          cd "$SRC_DIR"

          SELECTED=(
            "cache"
            "inc"
            "footer.php"
            "header.php"
            "functions.php"
            "composer.json"
            "page-homepage.php"
            "page-pasang-lowongan.php"
            "single-lowongan.php"
            "archive-lowongan.php"
            "assets"
            "vendor"
          )

          RCLONE_BASE_OPTS="--progress --transfers ${RCLONE_TRANSFERS} --checkers ${RCLONE_CHECKERS} --sftp-disable-hashcheck --retries ${RCLONE_RETRIES} --low-level-retries ${RCLONE_LOW_RETRIES} --timeout 1m --contimeout 1m --log-level ${RCLONE_LOG_LEVEL}"

          if [ "${DRY_RUN:-false}" = "true" ]; then
            DRY_FLAG="--dry-run"
          else
            DRY_FLAG=""
          fi

          # Test rclone remote connectivity before heavy operations
          if ! rclone lsd sftpdeploy: >/dev/null 2>&1; then
            echo "ERROR: cannot list remote 'sftpdeploy:' — connection may be misconfigured"
            echo "Try checking ssh-auth (run details) and secrets"
            exit 1
          fi

          for p in "${SELECTED[@]}"; do
            if [ ! -e "$p" ]; then
              echo "Skipping $p; not present"
              continue
            fi

            if [ -f "$p" ]; then
              REMOTE_DIR="${REMOTE_PATH%/}"
              echo "rclone copy $p -> sftpdeploy:${REMOTE_DIR}/ $DRY_FLAG"
              rclone copy $DRY_FLAG $RCLONE_BASE_OPTS "$p" "sftpdeploy:${REMOTE_DIR}/" 2>&1 || true
              echo "FINISHED: file $p"
            else
              REMOTE_TARGET="${REMOTE_PATH%/}/$p"
              echo "rclone sync $p -> sftpdeploy:$REMOTE_TARGET $DRY_FLAG"
              rclone sync $DRY_FLAG $RCLONE_BASE_OPTS "$p" "sftpdeploy:$REMOTE_TARGET" 2>&1 || true
              echo "FINISHED: dir $p"
            fi
          done
          echo "---- DEPLOY SUMMARY ----"
          echo "Date: $(date -u)"
          echo "Rclone options: $RCLONE_BASE_OPTS"
          echo "Note: logs are not persisted; check the run logs in Actions for details."
          # cleanup: stop agent and remove temporary private key file
          ssh-agent -k || true
          if [ -n "${KEY_PATH:-}" ]; then
            rm -f "$KEY_PATH" || true
          fi