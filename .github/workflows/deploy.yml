name: Build & Deploy Theme via Rclone

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Perform a dry-run instead of a real deploy"
        required: false
        default: "false" # 'off', change to 'true' for dry runs

env:
  THEME_DIR: wordpress/wp-content/themes/wplokerbjm

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    env:
      RCLONE_TRANSFERS: "2"
      RCLONE_CHECKERS: "1"
      RCLONE_RETRIES: "100"
      RCLONE_LOW_RETRIES: "5"
      RCLONE_LOG_LEVEL: "INFO"
      RCLONE_BWLIMIT: "50M"
      RCLONE_TPSLIMIT: "2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          theme-dir: ${{ env.THEME_DIR }}
          install-jq: false

      - name: Build (theme)
        working-directory: ${{ env.THEME_DIR }}
        env:
          PUBLIC_CMS_ORIGIN: "https://wp.lokerbanjarmasin.my.id"
          PUBLIC_CMS_ORIGIN_DEV: "https://localhost"
        run: bun -b run build

      # sanity check - ensure the adapter produced a worker and assets
      - name: List build output
        working-directory: ${{ env.THEME_DIR }}
        run: |
          echo "Contents of .svelte-kit/cloudflare:";
          ls -al .svelte-kit/cloudflare || true


      - name: Setup deployment
        uses: ./.github/actions/setup-deployment
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-key-passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          host: ${{ secrets.HOST }}
          ssh-port: ${{ secrets.SSH_PORT }}
          ssh-user: ${{ secrets.SSH_USER }}

      - name: Install rclone and sync via SFTP
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
          SSH_USER: ${{ secrets.SSH_USER }}
          HOST: ${{ secrets.HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
          SRC_DIR: ${{ env.THEME_DIR }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          RCLONE_TRANSFERS: ${{ env.RCLONE_TRANSFERS }}
          RCLONE_CHECKERS: ${{ env.RCLONE_CHECKERS }}
          RCLONE_RETRIES: ${{ env.RCLONE_RETRIES }}
          RCLONE_LOW_RETRIES: ${{ env.RCLONE_LOW_RETRIES }}
          RCLONE_LOG_LEVEL: ${{ env.RCLONE_LOG_LEVEL }}
          MU_PLUGIN_REMOTE_PATH: ${{ secrets.MU_PLUGIN_REMOTE_PATH }}
        run: bash .github/scripts/deploy/rclone-sync.sh

      - name: Sveltekit to Cloudflare Worker
        working-directory: ${{ env.THEME_DIR }}
        env:
          WRANGLER_ENV: production
          CLOUDFLARE_API_TOKEN: ${{ secrets.EDIT_CLOUDFLARE_WORKER_SVELTEKIT }}
        run: |
          # specify env explicitly to silence warning
          bun wrangler deploy --env ${{ env.WRANGLER_ENV }} -c wrangler.prod.toml