name: Clean Noisy Workflows

on:
  schedule:
    # Run every day at 2 AM UTC to clean up old workflow runs
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      days_to_keep:
        description: "Keep workflow runs from the last N days"
        required: false
        default: "1"
        type: string
      target_owner:
        description: "Owner of the target repo"
        required: false
        default: "LNSR"
        type: string
      target_repo:
        description: "Name of the target repo"
        required: false
        default: "wplokerbjm"
        type: string

jobs:
  cleanup-ssg-workflows:
    name: Clean up workflow runs and artifacts
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Delete Old Workflow Runs
        uses: igorjs/gh-actions-clean-workflow@v6
        with:
          owner: ${{ github.event.inputs.target_owner || 'LNSR' }}
          repo: ${{ github.event.inputs.target_repo || 'wplokerbjm' }}
          runs_older_than: ${{ github.event.inputs.days_to_keep || '1' }}
          runs_to_keep: 0
