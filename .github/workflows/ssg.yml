name: SSG Build & Deploy

on:
  workflow_dispatch:
    inputs:
      paths:
        description: "Paths to regenerate (JSON array)"
        required: false
        type: string
      reason:
        description: "Trigger reason"
        required: false
        type: string
      dry_run:
        description: "Perform a dry-run instead of a real deploy"
        required: false
        default: "false"

env:
  THEME_DIR: wordpress/wp-content/themes/astra-child

jobs:
  build-and-deploy:
    name: Build and deploy SSG
    runs-on: ubuntu-latest
    env:
      RCLONE_TRANSFERS: "4"
      RCLONE_CHECKERS: "8"
      RCLONE_RETRIES: "3"
      RCLONE_LOW_RETRIES: "10"
      RCLONE_LOG_LEVEL: "INFO"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          theme-dir: ${{ env.THEME_DIR }}
          install-jq: true
          install-playwright: true

      - name: Setup deployment
        uses: ./.github/actions/setup-deployment
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          host: ${{ secrets.HOST }}
          ssh-port: ${{ secrets.SSH_PORT }}
          ssh-key-passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          ssh-user: ${{ secrets.SSH_USER }}

      - name: Generate and Deploy SSG Content
        working-directory: ${{ env.THEME_DIR }}
        env:
          SSG_MINIFY_HTML: "true"
          GITHUB_PATHS: ${{ github.event.inputs.paths }}
          GITHUB_REASON: ${{ github.event.inputs.reason }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
          SSH_USER: ${{ secrets.SSH_USER }}
          HOST: ${{ secrets.HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
          SRC_DIR: ${{ env.THEME_DIR }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          RCLONE_TRANSFERS: ${{ env.RCLONE_TRANSFERS }}
          RCLONE_CHECKERS: ${{ env.RCLONE_CHECKERS }}
          RCLONE_RETRIES: ${{ env.RCLONE_RETRIES }}
          RCLONE_LOW_RETRIES: ${{ env.RCLONE_LOW_RETRIES }}
          RCLONE_LOG_LEVEL: ${{ env.RCLONE_LOG_LEVEL }}
        run: bash ../../../../.github/scripts/ssg/generate-ssg-selective.sh
