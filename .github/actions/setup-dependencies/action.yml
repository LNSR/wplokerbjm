name: "Setup Dependencies"
description: "Setup common dependencies with caching for Node.js modules and Playwright browsers"

inputs:
  theme-dir:
    description: "Path to the theme directory"
    required: false
    default: "wordpress/wp-content/themes/wplokerbjm"
  install-jq:
    description: "Whether to install jq"
    required: false
    default: "false"
  install-playwright:
    description: "Whether to install Playwright browsers"
    required: false
    default: "false"
  install-brotli:
    description: "Whether to install brotli for compression"
    required: false
    default: "true"
  enable-apt-cache:
    description: "Enable APT caching behavior in this action"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Compute APT cache key
      if: ${{ inputs.enable-apt-cache == 'true' }}
      id: compute-apt-key
      run: |
        set -euo pipefail
        # Attempt to get a stable identifier for apt sources and distro
        CODENAME=$(lsb_release -cs 2>/dev/null || echo "${RUNNER_OS:-${{ runner.os }}}")
        # Hash sources files if present
        SHA=""
        if [ -f /etc/apt/sources.list ] || [ -d /etc/apt/sources.list.d ]; then
          find /etc/apt -maxdepth 2 -type f -name '*.list' -print0 2>/dev/null | sort -z | xargs -0 sha256sum 2>/dev/null | sha256sum | awk '{print $1}' || SHA=""
        fi
        # Fallback to action file hash + codename if no sources hash
        if [ -z "$SHA" ]; then
          SHA=$(sha256sum .github/actions/setup-dependencies/action.yml 2>/dev/null | awk '{print $1}' || echo "base")
        fi
        APT_KEY="${CODENAME}-${SHA}"
        echo "apt_key=$APT_KEY" >> $GITHUB_OUTPUT
      shell: bash

    - name: Cache APT archives and lists
      if: ${{ inputs.enable-apt-cache == 'true' }}
      uses: actions/cache@v4
      id: apt-cache
      with:
        path: |
          ~/.apt-cache/archives
          ~/.apt-cache/lists
        key: ${{ runner.os }}-apt-${{ steps.compute-apt-key.outputs.apt_key }}
        restore-keys: |
          ${{ runner.os }}-apt-

    - name: Setup jq for JSON parsing
      if: ${{ inputs.install-jq == 'true' }}
      run: |
        # Restore APT cache if available
        if [ "${{ steps.apt-cache.outputs.cache-hit }}" == "true" ]; then
          echo "✅ APT cache restored - copying to system locations"
          # Create user cache directories if they don't exist
          mkdir -p ~/.apt-cache/lists ~/.apt-cache/archives
          # Copy cached lists to system location
          sudo mkdir -p /var/lib/apt/lists
          sudo cp -a ~/.apt-cache/lists/* /var/lib/apt/lists/ 2>/dev/null || true
          # Copy cached archives to system location
          sudo mkdir -p /var/cache/apt/archives
          sudo cp -a ~/.apt-cache/archives/* /var/cache/apt/archives/ 2>/dev/null || true
          echo "✅ Using cached APT data - skipping apt-get update"
        fi

        if ! command -v jq &> /dev/null; then
          echo "Installing jq..."
          
          # Create user cache directories if they don't exist
          mkdir -p ~/.apt-cache/lists ~/.apt-cache/archives
          
          # If cache wasn't restored, we need to refresh package lists
          if [ "${{ steps.apt-cache.outputs.cache-hit }}" != "true" ]; then
            echo "❌ APT cache miss - running apt-get update"
            # Retry apt-get update a few times to avoid transient network errors
            n=0
            until [ $n -ge 3 ]; do
              sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq && break
              n=$((n+1))
              echo "apt-get update failed, retrying ($n/3)..."; sleep $((n*2))
            done
            # Copy updated lists to user cache for future runs
            cp -a /var/lib/apt/lists/* ~/.apt-cache/lists/ 2>/dev/null || true
          else
            # Validate that restored lists are not empty; if they look empty, do an update
            if [ -z "$(ls -A /var/lib/apt/lists 2>/dev/null)" ]; then
              echo "Restored APT lists appear empty; running apt-get update"
              sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq || true
            fi
          fi
          
          # Use noninteractive and no-install-recommends to speed and reduce size
          # Retry apt-get install with backoff for robustness
          n=0
          until [ $n -ge 3 ]; do
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends jq && break
            n=$((n+1))
            echo "apt-get install failed, retrying ($n/3)..."; sleep $((n*2))
          done
        else
          echo "✅ jq already installed: $(jq --version)"
        fi
      shell: bash

    - name: Setup brotli for compression
      if: ${{ inputs.install-brotli == 'true' }}
      run: |
        # Restore APT cache if available
        if [ "${{ steps.apt-cache.outputs.cache-hit }}" == "true" ]; then
          echo "✅ APT cache restored - copying to system locations"
          # Create user cache directories if they don't exist
          mkdir -p ~/.apt-cache/lists ~/.apt-cache/archives
          # Copy cached lists to system location
          sudo mkdir -p /var/lib/apt/lists
          sudo cp -a ~/.apt-cache/lists/* /var/lib/apt/lists/ 2>/dev/null || true
          # Copy cached archives to system location
          sudo mkdir -p /var/cache/apt/archives
          sudo cp -a ~/.apt-cache/archives/* /var/cache/apt/archives/ 2>/dev/null || true
          echo "✅ Using cached APT data - skipping apt-get update"
        fi

        if ! command -v brotli &> /dev/null; then
          echo "Installing brotli..."
          
          # Create user cache directories if they don't exist
          mkdir -p ~/.apt-cache/lists ~/.apt-cache/archives
          
          # If cache wasn't restored, we need to refresh package lists
          if [ "${{ steps.apt-cache.outputs.cache-hit }}" != "true" ]; then
            echo "❌ APT cache miss - running apt-get update"
            # Retry apt-get update a few times to avoid transient network errors
            n=0
            until [ $n -ge 3 ]; do
              sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq && break
              n=$((n+1))
              echo "apt-get update failed, retrying ($n/3)..."; sleep $((n*2))
            done
            # Copy updated lists to user cache for future runs
            cp -a /var/lib/apt/lists/* ~/.apt-cache/lists/ 2>/dev/null || true
          else
            # Validate that restored lists are not empty; if they look empty, do an update
            if [ -z "$(ls -A /var/lib/apt/lists 2>/dev/null)" ]; then
              echo "Restored APT lists appear empty; running apt-get update"
              sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq || true
            fi
          fi
          
          # Use noninteractive and no-install-recommends to speed and reduce size
          # Retry apt-get install with backoff for robustness
          n=0
          until [ $n -ge 3 ]; do
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends brotli && break
            n=$((n+1))
            echo "apt-get install failed, retrying ($n/3)..."; sleep $((n*2))
          done
        else
          echo "✅ brotli already installed: $(brotli --version | head -1)"
        fi
      shell: bash

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1

    - name: Verify Bun
      run: |
        echo "Bun: $(bun --version || echo 'bun not found')"
      shell: bash

    - name: Cache node_modules
      uses: actions/cache@v4
      id: bun-cache
      with:
        path: ${{ inputs.theme-dir }}/node_modules
        key: ${{ runner.os }}-bun-v2-${{ hashFiles('**/bun.lock', '**/package.json') }}
        restore-keys: |
          ${{ runner.os }}-bun-v2-
          ${{ runner.os }}-bun-

    - name: Check Bun cache status
      run: |
        if [ "${{ steps.bun-cache.outputs.cache-hit }}" == "true" ]; then
          echo "✅ Bun cache hit - node_modules restored from cache"
        else
          echo "❌ Bun cache miss - will install fresh dependencies"
        fi
      shell: bash

    - name: Install dependencies (theme)
      working-directory: ${{ inputs.theme-dir }}
      run: |
        # ensure bun is available
        echo "Bun: $(bun --version || echo 'bun not found')"
        bun install
      shell: bash

    - name: Cache Playwright browsers
      if: ${{ inputs.install-playwright == 'true' }}
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: |
          /home/runner/.cache/ms-playwright
          ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-v2-${{ hashFiles('**/bun.lock', '**/package.json') }}
        restore-keys: |
          ${{ runner.os }}-playwright-v2-
          ${{ runner.os }}-playwright-chromium-

    - name: Setup Playwright
      if: ${{ inputs.install-playwright == 'true' }}
      working-directory: ${{ inputs.theme-dir }}
      run: |
        # Only install Chromium (Chrome) browser for faster setup
        if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
          echo "❌ Playwright cache miss - installing Chromium with dependencies..."
          bunx playwright install --with-deps chromium
        else
          echo "✅ Playwright cache hit - using cached browsers"
          # Still need to install system dependencies even when browsers are cached
          bunx playwright install-deps chromium
        fi
      shell: bash

    - name: Sync system APT data back to user cache for upload
      run: |
        # Ensure any lists/archives downloaded by apt during this job are copied into
        # the user cache directory so the actions/cache step can upload them at job end.
        mkdir -p ~/.apt-cache/lists ~/.apt-cache/archives

        # Copy package lists
        if [ -d /var/lib/apt/lists ]; then
          cp -a /var/lib/apt/lists/* ~/.apt-cache/lists/ 2>/dev/null || true
        fi

        # Copy package archives
        if [ -d /var/cache/apt/archives ]; then
          cp -a /var/cache/apt/archives/* ~/.apt-cache/archives/ 2>/dev/null || true
        fi

        # Set proper ownership
        chown -R $USER:$(id -gn) ~/.apt-cache 2>/dev/null || true

        echo "✅ APT cache synced back to user directory"
      shell: bash